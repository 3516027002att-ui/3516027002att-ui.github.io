title: Symphony
description: 技术文章、研究观察与长期思考
lang: zh-CN
timezone: Asia/Tokyo
url: "https://3516027002att-ui.github.io"
baseurl: ""

markdown: kramdown
permalink: /:categories/:year/:month/:day/:title/

collections:
  notes:
    output: true
    permalink: /notes/:name/
  thoughts:
    output: true
    permalink: /thoughts/:name/
  interludes:
    output: true
    permalink: /interludes/:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      section: essays
  - scope:
      path: ""
      type: notes
    values:
      section: notes
  - scope:
      path: ""
      type: thoughts
    values:
      section: thoughts
  - scope:
      path: ""
      type: interludes
    values:
      section: interludes

plugins:
  - jekyll-feed

exclude:
  - README.md
  - CLAUDE.md
