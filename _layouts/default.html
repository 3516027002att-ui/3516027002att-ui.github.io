<!doctype html>
<html lang="zh-CN" data-mode="opal"{% if page.layout == "post" %} data-page="article"{% endif %}>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="theme-color" content="#fcfbf8">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    {% feed_meta %}
  </head>
  <body>
    <a class="skip-link" href="#main">跳到正文</a>
    <canvas id="spectral-field" aria-hidden="true"></canvas>

    <header class="site-header frame">
      {%- unless page.url == "/" %}
      <a class="wordmark" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      {%- endunless %}
      <nav class="site-nav" aria-label="栏目">
        <ul role="list">
          {%- for s in site.data.sections %}
          <li><a href="{{ s.url | relative_url }}"{% if page.url == s.url %} aria-current="page"{% elsif page.section == s.key %} class="is-active"{% endif %}>{{ s.title }}</a></li>
          {%- endfor %}
        </ul>
      </nav>
    </header>

    <main id="main" class="site-main frame">
      {{ content }}
    </main>

    <footer class="site-footer frame">
      <p>© {{ site.time | date: '%Y' }} {{ site.title }}</p>
    </footer>

    <script src="{{ '/assets/js/theme-config.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/spectral-field.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/site-theme.js' | relative_url }}"></script>
  </body>
</html>
