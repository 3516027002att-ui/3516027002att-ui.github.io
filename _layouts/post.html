---
layout: default
---

<article class="post">
  <p><a href="{{ '/' | relative_url }}">← Home</a></p>
  <h1>{{ page.title }}</h1>
  <p class="meta">
    {{ page.date | date: "%Y-%m-%d" }}{% if page.category %} · {{ page.category }}{% endif %}{% if page.tags %} · {{ page.tags | join: ', ' }}{% endif %}
  </p>
  {{ content }}
</article>
