---
layout: default
---

<article class="post">
  <p><a href="{{ '/' | relative_url }}">← 首页</a></p>
  <h1>{{ page.title }}</h1>
  <p class="meta">
    {{ page.date | date: "%Y-%m-%d %H:%M" }}{% if page.category == "note" %} · 观察{% elsif page.category == "essay" %} · 文章{% elsif page.category == "thought" %} · 思考{% endif %}{% if page.tags %} · {{ page.tags | join: ', ' }}{% endif %}
  </p>
  {{ content }}
</article>
